# Generated by tests/orca-keymap.py from Orca 50.3's default desktop key map.
# Do not include this file from a sway config: regolith-sway-screen-reader applies it
# over IPC while the screen reader is on and Orca's remote controller is running,
# and removes it again when either stops.
#
# The Orca key is Insert or keypad Insert (Num Lock off). Orca+key chords and the
# keypad keys run Orca's command through regolith-orcactl, so the key never reaches
# the focused application.

# The Orca key on its own: keep it from the application.
bindsym --no-repeat Insert nop orca key
bindsym --no-repeat KP_Insert nop orca key

# Orca+key chords
bindsym --no-repeat Ctrl+Insert+Down exec regolith-orcactl key Orca+Ctrl+Down
bindsym --no-repeat Ctrl+KP_Insert+Down exec regolith-orcactl key Orca+Ctrl+Down
bindsym --no-repeat Ctrl+Insert+Left exec regolith-orcactl key Orca+Ctrl+Left
bindsym --no-repeat Ctrl+KP_Insert+Left exec regolith-orcactl key Orca+Ctrl+Left
bindsym --no-repeat Ctrl+Insert+Return exec regolith-orcactl key Orca+Ctrl+Return
bindsym --no-repeat Ctrl+KP_Insert+Return exec regolith-orcactl key Orca+Ctrl+Return
bindsym --no-repeat Ctrl+Insert+Right exec regolith-orcactl key Orca+Ctrl+Right
bindsym --no-repeat Ctrl+KP_Insert+Right exec regolith-orcactl key Orca+Ctrl+Right
bindsym --no-repeat Ctrl+Insert+Up exec regolith-orcactl key Orca+Ctrl+Up
bindsym --no-repeat Ctrl+KP_Insert+Up exec regolith-orcactl key Orca+Ctrl+Up
bindsym --no-repeat Ctrl+Insert+s exec regolith-orcactl key Orca+Ctrl+s
bindsym --no-repeat Ctrl+KP_Insert+s exec regolith-orcactl key Orca+Ctrl+s
bindsym --no-repeat Insert+F11 exec regolith-orcactl key Orca+F11
bindsym --no-repeat KP_Insert+F11 exec regolith-orcactl key Orca+F11
bindsym --no-repeat Insert+F12 exec regolith-orcactl key Orca+F12
bindsym --no-repeat KP_Insert+F12 exec regolith-orcactl key Orca+F12
bindsym --no-repeat Insert+KP_Begin exec regolith-orcactl key Orca+KP_Begin
