# Keypad review, where am I and say all
bindsym --no-repeat KP_Add exec regolith-orcactl key KP_Add
bindsym --no-repeat KP_Begin exec regolith-orcactl key KP_Begin
bindsym --no-repeat KP_Down exec regolith-orcactl key KP_Down
bindsym --no-repeat KP_End exec regolith-orcactl key KP_End
bindsym --no-repeat KP_Enter exec regolith-orcactl key KP_Enter
bindsym --no-repeat KP_Home exec regolith-orcactl key KP_Home
