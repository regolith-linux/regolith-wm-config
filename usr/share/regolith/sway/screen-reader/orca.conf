bindsym --no-repeat KP_Up exec regolith-orcactl key KP_Up
bindsym --no-repeat Shift+Ctrl+Mod1+q exec regolith-orcactl key Shift+Ctrl+Alt+q

# Browse keys: Orca's structural, caret and table navigation keys. Orca+b enters
# the mode, Orca+b or Escape leaves it; regolith-sway-screen-reader announces both.
mode orca-browse {
    bindsym --no-repeat Insert+b mode default
    bindsym --no-repeat KP_Insert+b mode default
    bindsym --no-repeat Escape mode default
    bindsym 1 exec regolith-orcactl key 1
    bindsym 2 exec regolith-orcactl key 2
    bindsym 3 exec regolith-orcactl key 3
    bindsym 4 exec regolith-orcactl key 4
    bindsym 5 exec regolith-orcactl key 5
    bindsym 6 exec regolith-orcactl key 6
    bindsym Ctrl+End exec regolith-orcactl key Ctrl+End
    bindsym Ctrl+Home exec regolith-orcactl key Ctrl+Home
    bindsym Ctrl+Left exec regolith-orcactl key Ctrl+Left
    bindsym Ctrl+Right exec regolith-orcactl key Ctrl+Right
    bindsym Down exec regolith-orcactl key Down
    bindsym End exec regolith-orcactl key End
    bindsym Home exec regolith-orcactl key Home
    bindsym Left exec regolith-orcactl key Left
    bindsym Right exec regolith-orcactl key Right
    bindsym Shift+1 exec regolith-orcactl key Shift+1
    bindsym Shift+2 exec regolith-orcactl key Shift+2
    bindsym Shift+3 exec regolith-orcactl key Shift+3
    bindsym Shift+4 exec regolith-orcactl key Shift+4
    bindsym Shift+5 exec regolith-orcactl key Shift+5
    bindsym Shift+6 exec regolith-orcactl key Shift+6
